# Use Vim shortcuts
setw -g mode-keys vi
unbind -T copy-mode-vi MouseDragEnd1Pane

# Make `y` copy the selected text, not exiting the copy mode. For copy-and-exit
# use ordinary `Enter`
bind -T copy-mode-vi y send-keys -X copy-pipe  # Only copy, no cancel

# Use OSC-52 for clipboard integration. tmux 3.2 added terminal-features;
# older versions use the equivalent terminal override instead.
set -s set-clipboard on
if-shell -F '#{>=:#{version},3.2}' \
  "set-option -as terminal-features ',tmux-256color:clipboard,xterm-256color:clipboard'" \
  "set-option -ag terminal-overrides ',xterm-256color:Ms=\\\\E]52;c;%p2%s\\\\7'"

# allow-passthrough is available in tmux 3.3 and newer.
if-shell -F '#{>=:#{version},3.3}' 'set-option -g allow-passthrough on'

# Clear selection on single click
bind -T copy-mode-vi MouseDown1Pane send-keys -X clear-selection \; select-pane

# Increase scroll buffer to 50K lines
set-option -g history-limit 50000

# Increase pane numbers display time to 3 seconds
set -g display-panes-time 3000

# Make `Ctrl+B r` reload the config file
unbind r
bind r source-file ~/.tmux.conf

# Device identity comes from ~/.config/extra on the machine running tmux.
# Read the session environment when drawing, so attaching refreshes the theme.
set-option -g update-environment[1003] DOTFILES_DEVICE
set-option -g update-environment[1004] DOTFILES_COLOUR
set -g @device-label '#{?DOTFILES_DEVICE,#{DOTFILES_DEVICE},#{host_short}}'
# Use a consistent 256-colour palette; unset or unknown names default to green.
set -g @device-colour '#{?#{==:#{DOTFILES_COLOUR},blue},colour75,#{?#{==:#{DOTFILES_COLOUR},purple},colour141,#{?#{==:#{DOTFILES_COLOUR},orange},colour215,colour114}}}'
set -g status-style 'bg=#{E:@device-colour},fg=colour234'
set -g status-left '#[bold] #{E:@device-label} · #S #[default]'
set -g status-left-length 60
set-window-option -g window-status-current-style 'bg=colour234,fg=#{E:@device-colour},bold'
set -g set-titles on
set -g set-titles-string '#{E:@device-label} · #S · #W'

#set inactive/active window styles
#set -g window-style 'fg=colour247,bg=colour236'
#set -g window-active-style 'fg=colour250,bg=black'
set -g window-style 'fg=colour250,bg=colour234'
set -g window-active-style 'fg=white,bg=black'

# set the pane border colors
set -g pane-border-style 'fg=colour235,bg=colour238'
set -g pane-active-border-style 'fg=#{E:@device-colour},bg=colour236'
set -g pane-border-status top
set -g pane-border-format ' #P · #{?@pane-role,#{@pane-role},#{pane_current_command}} #{?@checkout-label,· #{@checkout-label},} '

# Enable mouse integration
set -g mouse on

# Change to the same directory of the last active pane when splitting
unbind '"'
bind '"' split-window -v -c "#{pane_current_path}"
unbind %
bind % split-window -h -c "#{pane_current_path}"

# suggestions by vim healthcheck
set-option -sg escape-time 10
set-option -g focus-events on
set -g default-terminal "tmux-256color"

# Repository/worktree views reuse the existing development layout.
set -g @repo-root "$HOME/repos"
bind R display-popup -E -w 85% -h 75% "$HOME/.tmux/layouts/pick-repo.sh"
bind M run-shell 'python3 "$HOME/.tmux/layouts/workspace.py" monitor "#{pane_id}"'
bind L run-shell 'python3 "$HOME/.tmux/layouts/workspace.py" logs "#{pane_id}"'
bind T run-shell 'python3 "$HOME/.tmux/layouts/workspace.py" tests "#{pane_id}"'
# run-shell expands the client context before display-popup runs (tmux 3.2+).
bind A run-shell 'tmux display-popup -t "#{client_tty}" -E -w 85% -h 75% "ccmux picker --client-tty #{client_tty}"'
# Optional sidebar; the default three-column layout keeps its full width.
bind B run-shell 'ccmux sidebar --toggle'
# One watcher per server, also started when the first session is created.
set-hook -g session-created[90] 'run-shell -b "python3 \"$HOME/.tmux/layouts/workspace.py\" watch"'
run-shell -b 'python3 "$HOME/.tmux/layouts/workspace.py" watch'

# Refresh tool lookup for popup helpers when creating or attaching to a session.
# A long-running server may predate Homebrew or other shell PATH changes.
set-option -g update-environment[1002] PATH

# Optional fixed repositories come from the single local Bash configuration.
# Refresh the values when clients create or attach to a session, and clear stale
# bindings before conditionally recreating them on every configuration reload.
set-option -g update-environment[1000] DOTFILES_TMUX_P_REPO
set-option -g update-environment[1001] DOTFILES_TMUX_S_REPO
unbind-key -q P
unbind-key -q S
if-shell '[ -n "${DOTFILES_TMUX_P_REPO:-}" ]' \
  "bind-key -T prefix P run-shell '\"\$HOME/.tmux/layouts/dev-3cols.sh\" \"\$DOTFILES_TMUX_P_REPO\"'"
if-shell '[ -n "${DOTFILES_TMUX_S_REPO:-}" ]' \
  "bind-key -T prefix S run-shell '\"\$HOME/.tmux/layouts/dev-3cols.sh\" \"\$DOTFILES_TMUX_S_REPO\"'"

# TPM
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'

set -g @resurrect-processes 'codex htop ping "sudo dmesg" "~/.tmux/layouts/workspace.py"'
set -g @resurrect-hook-post-save-layout 'python3 "$HOME/.tmux/layouts/workspace.py" save'

# Bootstrap installs TPM in the standard user path when no installation exists.
# The loader installs missing plugins before loading them, preserving installed
# versions. It also supports package-manager and explicit TPM paths.
if-shell '[ -r "$HOME/.tmux/load-tpm.sh" ]' \
  'run-shell "sh \"$HOME/.tmux/load-tpm.sh\""'
