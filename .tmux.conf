# Use Vim shortcuts
setw -g mode-keys vi
unbind -T copy-mode-vi MouseDragEnd1Pane

# Make `y` copy the selected text, not exiting the copy mode. For copy-and-exit
# use ordinary `Enter`
bind -T copy-mode-vi y send-keys -X copy-pipe  # Only copy, no cancel

# Use OSC-52 for clipboard integration. tmux 3.2 added terminal-features;
# older versions use the equivalent terminal override instead.
set -s set-clipboard on
if-shell -F '#{>=:#{version},3.2}' \
  "set-option -as terminal-features ',tmux-256color:clipboard,xterm-256color:clipboard'" \
  "set-option -ag terminal-overrides ',xterm-256color:Ms=\\\\E]52;c;%p2%s\\\\7'"

# allow-passthrough is available in tmux 3.3 and newer.
if-shell -F '#{>=:#{version},3.3}' 'set-option -g allow-passthrough on'

# Clear selection on single click
bind -T copy-mode-vi MouseDown1Pane send-keys -X clear-selection \; select-pane

# Increase scroll buffer to 50K lines
set-option -g history-limit 50000

# Increase pane numbers display time to 3 seconds
set -g display-panes-time 3000

# Make `Ctrl+B r` reload the config file
unbind r
bind r source-file ~/.tmux.conf

# Change status bar colour
set -g status-style "bg=colour046 fg=black"
set-window-option -g window-status-current-style bg=colour034

#set inactive/active window styles
#set -g window-style 'fg=colour247,bg=colour236'
#set -g window-active-style 'fg=colour250,bg=black'
set -g window-style 'fg=colour250,bg=colour234'
set -g window-active-style 'fg=white,bg=black'

# set the pane border colors
set -g pane-border-style 'fg=colour235,bg=colour238'
set -g pane-active-border-style 'fg=colour33,bg=colour236'

# Enable mouse integration
set -g mouse on

# Change to the same directory of the last active pane when splitting
unbind '"'
bind '"' split-window -v -c "#{pane_current_path}"
unbind %
bind % split-window -h -c "#{pane_current_path}"

# suggestions by vim healthcheck
set-option -sg escape-time 10
set-option -g focus-events on
set -g default-terminal "tmux-256color"

# Pick a repository and open the generic development layout.
set -g @repo-root "$HOME/repos"
bind R display-popup -E "$HOME/.tmux/layouts/pick-repo.sh"

# Optional fixed repositories come from the single local Bash configuration.
# Refresh the values when clients create or attach to a session, and clear stale
# bindings before conditionally recreating them on every configuration reload.
set-option -g update-environment[1000] DOTFILES_TMUX_P_REPO
set-option -g update-environment[1001] DOTFILES_TMUX_S_REPO
unbind-key -q P
unbind-key -q S
if-shell '[ -n "${DOTFILES_TMUX_P_REPO:-}" ]' \
  "bind-key -T prefix P run-shell '\"\$HOME/.tmux/layouts/dev-3cols.sh\" \"\$DOTFILES_TMUX_P_REPO\"'"
if-shell '[ -n "${DOTFILES_TMUX_S_REPO:-}" ]' \
  "bind-key -T prefix S run-shell '\"\$HOME/.tmux/layouts/dev-3cols.sh\" \"\$DOTFILES_TMUX_S_REPO\"'"

# TPM
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'

set -g @resurrect-processes 'codex'

# Bootstrap installs TPM in the standard user path when no installation exists.
# The loader also supports package-manager and explicit paths, and remains safe
# during a dry run or before bootstrap has been applied.
if-shell '[ -r "$HOME/.tmux/load-tpm.sh" ]' \
  'run-shell "sh \"$HOME/.tmux/load-tpm.sh\""'
