# Native PowerShell panes. Requires PSMux 3.3.8 or newer.
set -g default-shell pwsh.exe
set -g history-limit 50000
set -g mouse on
setw -g mode-keys vi
set -g allow-predictions on
set -g pane-border-status top
set -g pane-border-format ' #P · #{pane_title} · #W '
set -g status-left '#[bold] #{?DOTFILES_DEVICE,#{DOTFILES_DEVICE},#{host_short}} · #S '
set -g status-left-length 60
set -g @device-colour '#{?#{==:#{DOTFILES_COLOUR},blue},colour75,#{?#{==:#{DOTFILES_COLOUR},purple},colour141,#{?#{==:#{DOTFILES_COLOUR},orange},colour215,colour114}}}'
set -g status-style 'bg=#{E:@device-colour},fg=colour234'
set -g pane-active-border-style 'fg=#{E:@device-colour}'
set -g set-titles on
set -g set-titles-string '#S · #W'

bind r source-file ~/.psmux.conf
bind '"' split-window -v -c '#{pane_current_path}'
bind % split-window -h -c '#{pane_current_path}'
bind R display-popup -w 85% -h 75% '& pwsh -NoLogo -NoProfile -File "$HOME/.config/dotfiles/windows/workspace/workspace.ps1" pick'
bind M run-shell -b '& pwsh -NoLogo -NoProfile -File "$HOME/.config/dotfiles/windows/workspace/workspace.ps1" monitor "#{pane_id}"'
bind L run-shell -b '& pwsh -NoLogo -NoProfile -File "$HOME/.config/dotfiles/windows/workspace/workspace.ps1" logs "#{pane_id}"'
bind T run-shell -b '& pwsh -NoLogo -NoProfile -File "$HOME/.config/dotfiles/windows/workspace/workspace.ps1" tests "#{pane_id}"'
bind A display-popup -w 85% -h 75% '& pwsh -NoLogo -NoProfile -File "$HOME/.config/dotfiles/windows/workspace/workspace.ps1" agents'
bind B run-shell -b '& pwsh -NoLogo -NoProfile -File "$HOME/.config/dotfiles/windows/workspace/workspace.ps1" sidebar'
bind P run-shell -b '& pwsh -NoLogo -NoProfile -File "$HOME/.config/dotfiles/windows/workspace/workspace.ps1" shortcut P'
bind S run-shell -b '& pwsh -NoLogo -NoProfile -File "$HOME/.config/dotfiles/windows/workspace/workspace.ps1" shortcut S'
set-hook -g after-new-window 'run-shell -b "& pwsh -NoLogo -NoProfile -File \"$HOME/.config/dotfiles/windows/workspace/workspace.ps1\" sidebar-add"'
set-hook -g after-kill-pane 'run-shell -b "& pwsh -NoLogo -NoProfile -File \"$HOME/.config/dotfiles/windows/workspace/workspace.ps1\" sidebar-restore"'
set-hook -g pane-exited 'run-shell -b "& pwsh -NoLogo -NoProfile -File \"$HOME/.config/dotfiles/windows/workspace/workspace.ps1\" sidebar-restore"'
set-hook -g session-created 'run-shell -b "& pwsh -NoLogo -NoProfile -File \"$HOME/.config/dotfiles/windows/workspace/workspace.ps1\" watch"'
run-shell -b '& pwsh -NoLogo -NoProfile -File "$HOME/.config/dotfiles/windows/workspace/workspace.ps1" watch'
